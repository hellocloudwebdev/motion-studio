name: Motion Studio CI

on:
  push:
    branches: [main, "milestone/**"]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [24, 26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run validate:example
      - run: npm run route:example
      - run: npm run compile:example

  render-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
      - name: Install Motion Studio dependencies
        run: npm install --no-audit --no-fund
      - name: Render real HyperFrames MP4 and verify with FFprobe
        run: npm run render:smoke
      - name: Upload render and QA receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: motion-studio-0.4-render-smoke
          path: artifacts/render-smoke/
          if-no-files-found: warn
          retention-days: 14

  installer-lifecycle:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Exercise clean install, repeat install and uninstall in an isolated home
        run: npm run test:installer-lifecycle
        env:
          MOTION_STUDIO_NO_OPEN_URL: '1'

